name: Feature request
description: An idea for the kit.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How you would like it to work. Examples of the config or the output are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you tried, or other ways to get there.
